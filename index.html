<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>3D прогулка — дом 60 м²</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0d10;font-family:system-ui,sans-serif;color:#eee}
#c{display:block;width:100%;height:100%}
#ui{position:fixed;top:12px;left:12px;background:rgba(0,0,0,.62);padding:10px 12px;border-radius:12px;max-width:min(420px,92vw);z-index:5}
#ui b{display:block;font-size:13px;margin-bottom:4px}
#ui p{font-size:12px;opacity:.75;line-height:1.4}
#ui .row{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
button{border:0;border-radius:8px;padding:7px 10px;background:#222;color:#fff;cursor:pointer;font-size:12px}
button.on{background:#c9a227;color:#111}
#pad{position:fixed;left:12px;bottom:12px;display:grid;grid-template-columns:48px 48px 48px;gap:6px;z-index:5}
#hint{position:fixed;right:12px;bottom:12px;background:rgba(0,0,0,.62);padding:8px 10px;border-radius:10px;font-size:12px;z-index:5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <b>Дом ≈ 60 м² · участок 15×20 м</b>
  <p>WASD или кнопки — идти. Зажмите мышь и тяните — смотреть. Shift — бег.</p>
  <div class="row">
    <button id="walk" class="on">Прогулка</button>
    <button id="orbit">Облёт</button>
    <button id="in">В дом</button>
    <button id="yard">Во двор</button>
  </div>
</div>
<div id="pad">
  <span></span><button id="fwd">▲</button><span></span>
  <button id="left">◀</button><button id="back">▼</button><button id="right">▶</button>
</div>
<div id="hint">Двор</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js" onload="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/gh/BogateyDi/dom-3d-progulka@main/walk.js';document.body.appendChild(s)"></script>
</body>
</html>
